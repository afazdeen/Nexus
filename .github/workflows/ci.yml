name: CI

on:
  push:
    branches: ['**'] # every branch (but not tag pushes)

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: task-portal
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: task-portal/package-lock.json

      # --ignore-scripts: better-sqlite3 ships prebuilt binaries (linux-x64 included), but npm ci still
      # tries to compile it from source because it contains a binding.gyp. Skipping install scripts avoids
      # that build, and also keeps third-party install scripts from running in CI.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Building imports the API routes, which open the database; keep that out of the workspace.
          DATABASE_PATH: ${{ runner.temp }}/build.db

      - name: Test
        run: npm test
